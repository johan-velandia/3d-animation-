<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GINE - Escenario 3D</title>

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        #titulo {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 4px;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0, 220, 240, 0.7);
            pointer-events: none;
        }

        #instrucciones {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00bfcf;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="titulo">GINE</div>
    <div id="instrucciones">SOLUCIÓN DE INVENTARIO</div>

    <a-scene background="color: #050505" renderer="colorManagement: true; physicallyCorrectLights: true">

        <!-- CARGA DE ARCHIVOS -->
        <a-assets>
            <a-asset-item id="gine-modelo" src="assets/gine.glb"></a-asset-item>
        </a-assets>

        <!-- ILUMINACIÓN -->
        <a-light type="directional" position="0 6 6" intensity="4" color="#ffffff"></a-light>
        <a-light type="point" position="0 3 4" intensity="2.5" distance="15" color="#ffffff"></a-light>
        <a-light type="point" position="4 2 1" intensity="3" distance="12" color="#00b8c8"></a-light>
        <a-light type="point" position="-4 2 1" intensity="2" distance="12" color="#ffffff"></a-light>
        <a-light type="spot" position="0 7 5" rotation="-35 0 0" intensity="5" angle="35" penumbra="0.6" color="#ffffff"></a-light>

        <!-- PISO Y PARED -->
        <a-plane id="piso" position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#080808" shadow></a-plane>
        <a-plane id="pared" position="0 5 -5" rotation="0 0 0" width="30" height="10" color="#030303"></a-plane>

        <!-- PLATAFORMA BASE -->
        <a-cylinder id="plataforma" position="0 0.15 0" radius="4" height="0.3" color="#111111" shadow></a-cylinder>
        <a-torus position="0 0.32 0" radius="3.8" radius-tubular="0.035" color="#00b8c8" rotation="90 0 0"></a-torus>

        <!-- MODELO 3D INTEGRADO (Sin animación y a mayor altura) -->
        <a-entity 
            id="GINE-3D" 
            gltf-model="#gine-modelo" 
            position="0 3.0 0" 
            rotation="0 0 0" 
            scale="1 1 1"
            shadow="cast: true; receive: true">
        </a-entity>

        <!-- DECORACIÓN DEL ESCENARIO -->
        <a-box position="0 0.5 -4" width="7" height="0.04" depth="0.04" color="#00b8c8"></a-box>
        <a-cylinder position="-5 1 -2" radius="0.05" height="2" color="#00b8c8"></a-cylinder>
        <a-cylinder position="5 1 -2" radius="0.05" height="2" color="#00b8c8"></a-cylinder>

        <!-- CÁMARA -->
        <a-entity id="camara" camera position="0 2.8 9" look-controls></a-entity>

    </a-scene>

</body>
</html>
